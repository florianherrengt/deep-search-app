name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag, for example alpha-0.0.1 or v1.2.3
        required: true
        type: string
      notes:
        description: Optional release notes. Leave empty to generate notes from commits.
        required: false
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: Resolve release version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          release_json="$(npm run --silent release:set-version -- "$RELEASE_INPUT" --dry-run --json)"
          node -e '
            const data = JSON.parse(process.argv[1]);
            for (const [key, value] of Object.entries(data)) {
              console.log(`${key}=${value}`);
            }
          ' "$release_json" >> "$GITHUB_OUTPUT"

      - name: Verify committed source version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source_version="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')"
          if [ "$source_version" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json is $source_version but the requested release is $RELEASE_VERSION. Run npm run release:set-version -- $RELEASE_VERSION and commit the result first."
            exit 1
          fi

      - name: Create or locate release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already targets $remote_sha instead of $GITHUB_SHA."
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          find_release_id() {
            local release_id=""
            for delay in 1 2 4 8 16; do
              release_id="$(
                gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                  --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" \
                  | head -n 1 \
                  || true
              )"
              if [ -n "$release_id" ]; then
                printf "%s" "$release_id"
                return 0
              fi
              echo "Release $RELEASE_TAG is not visible yet; retrying in ${delay}s." >&2
              sleep "$delay"
            done
          }

          release_id="$(find_release_id)"

          if [ -n "$release_id" ]; then
            release_is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)"
            if [ "$release_is_draft" != "true" ]; then
              echo "::error::Published release $RELEASE_TAG already exists."
              exit 1
            fi
            echo "Reusing draft release $RELEASE_TAG ($release_id)."
          else
            args=(
              "$RELEASE_TAG"
              "--repo" "$GITHUB_REPOSITORY"
              "--verify-tag"
              "--title" "Deep Search $RELEASE_TAG"
              "--draft"
            )

            if [ -n "$RELEASE_NOTES" ]; then
              notes_file="$(mktemp)"
              printf "%s" "$RELEASE_NOTES" > "$notes_file"
              args+=("--notes-file" "$notes_file")
            else
              args+=("--generate-notes")
            fi

            gh release create "${args[@]}"
            release_id="$(find_release_id)"
          fi

          if [ -z "$release_id" ]; then
            echo "::error::Could not resolve release ID for $RELEASE_TAG."
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Set release version
        run: npm run release:set-version -- "${{ needs.prepare-release.outputs.tag }}"

      - name: Install dependencies
        run: npm ci

      - name: Configure Windows NSIS bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            fs.writeFileSync('src-tauri/bundle-targets.json', JSON.stringify({
              bundle: { targets: ['nsis', 'app'] },
            }, null, 2));
          "

      - name: Write updater config
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          fi

          if [ -z "$UPDATER_PUBKEY" ]; then
            echo "::error::Missing TAURI_UPDATER_PUBKEY secret."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const config = {
            bundle: {
              createUpdaterArtifacts: true,
            },
            plugins: {
              updater: {
                pubkey: process.env.UPDATER_PUBKEY,
                endpoints: [process.env.UPDATER_ENDPOINT],
              },
            },
          };

          fs.writeFileSync(
            "src-tauri/updater-config.json",
            JSON.stringify(config, null, 2),
          );
          NODE

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          includeUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json --config src-tauri/updater-config.json ${{ runner.os == 'Windows' && '--config src-tauri/bundle-targets.json' || '' }}

  publish-release:
    name: Publish verified release
    needs:
      - prepare-release
      - publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: Download updater signatures
        shell: bash
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          mkdir -p updater-assets
          assets_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")"

          download_signature() {
            suffix="$1"
            asset_name="$(jq -r --arg suffix "$suffix" '.[] | select(.name | endswith($suffix)) | .name' <<<"$assets_json" | head -n 1)"
            if [ -z "$asset_name" ]; then
              echo "::error::Could not find a release asset ending in $suffix."
              exit 1
            fi
            asset_id="$(jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' <<<"$assets_json" | head -n 1)"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -H "Accept: application/octet-stream" > "updater-assets/$asset_name"
          }

          download_signature "_aarch64.app.tar.gz.sig"
          download_signature "_x64.app.tar.gz.sig"
          download_signature "_x64-setup.exe.sig"

      - name: Build merged updater manifest
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const repository = process.env.RELEASE_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const version = process.env.RELEASE_VERSION;
          const directory = "updater-assets";
          const files = fs.readdirSync(directory);

          function entry(signatureSuffix) {
            const signatureName = files.find((name) => name.endsWith(signatureSuffix));
            if (!signatureName) {
              throw new Error(`Missing updater signature for ${signatureSuffix}`);
            }
            const assetName = signatureName.slice(0, -".sig".length);
            return {
              signature: fs.readFileSync(path.join(directory, signatureName), "utf8").trim(),
              url: `https://github.com/${repository}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(assetName)}`,
            };
          }

          const macArm = entry("_aarch64.app.tar.gz.sig");
          const macIntel = entry("_x64.app.tar.gz.sig");
          const windows = entry("_x64-setup.exe.sig");

          fs.writeFileSync(
            "latest.json",
            JSON.stringify({
              version,
              notes: "",
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": macArm,
                "darwin-aarch64-app": macArm,
                "darwin-x86_64": macIntel,
                "darwin-x86_64-app": macIntel,
                "windows-x86_64": windows,
                "windows-x86_64-nsis": windows,
              },
            }, null, 2),
          );
          NODE

          gh release upload "${{ needs.prepare-release.outputs.tag }}" latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          asset_names="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].name')"
          for pattern in \
            '_x64\.dmg$' \
            '_aarch64\.dmg$' \
            '_x64-setup\.exe$' \
            '_x64\.app\.tar\.gz$' \
            '_aarch64\.app\.tar\.gz$' \
            '_x64\.app\.tar\.gz\.sig$' \
            '_aarch64\.app\.tar\.gz\.sig$' \
            '_x64-setup\.exe\.sig$' \
            '^latest\.json$'; do
            if ! grep -Eq "$pattern" <<<"$asset_names"; then
              echo "::error::Release $RELEASE_TAG is missing an expected asset matching $pattern."
              exit 1
            fi
          done

          mkdir -p updater-manifest
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir updater-manifest \
            --clobber

          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("updater-manifest/latest.json", "utf8"));
          const requiredPlatforms = [
            "darwin-aarch64",
            "darwin-x86_64",
            "windows-x86_64",
          ];

          if (manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error(`Updater manifest version ${manifest.version} does not match ${process.env.RELEASE_VERSION}`);
          }

          for (const platform of requiredPlatforms) {
            const entry = manifest.platforms?.[platform];
            if (!entry?.signature || !entry.url) {
              throw new Error(`Updater manifest is missing ${platform}`);
            }
            if (!entry.url.includes(`/releases/download/${process.env.RELEASE_TAG}/`)) {
              throw new Error(`Updater URL for ${platform} does not target ${process.env.RELEASE_TAG}`);
            }
          }
          NODE

          # The app has one update channel backed by /releases/latest. GitHub
          # excludes releases flagged as prereleases from that endpoint, even
          # when their SemVer and display names contain alpha/beta labels.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            --silent
