name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag, for example alpha-0.0.1 or v1.2.3
        required: true
        type: string
      notes:
        description: Optional release notes. Leave empty to generate notes from commits.
        required: false
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: Resolve release version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          release_json="$(npm run --silent release:set-version -- "$RELEASE_INPUT" --dry-run --json)"
          node -e '
            const data = JSON.parse(process.argv[1]);
            for (const [key, value] of Object.entries(data)) {
              console.log(`${key}=${value}`);
            }
          ' "$release_json" >> "$GITHUB_OUTPUT"

      - name: Verify committed source version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source_version="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')"
          if [ "$source_version" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json is $source_version but the requested release is $RELEASE_VERSION. Run npm run release:set-version -- $RELEASE_VERSION and commit the result first."
            exit 1
          fi

      - name: Create or locate release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already targets $remote_sha instead of $GITHUB_SHA."
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          find_release_id() {
            local release_id=""
            for delay in 1 2 4 8 16; do
              release_id="$(
                gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                  --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" \
                  | head -n 1 \
                  || true
              )"
              if [ -n "$release_id" ]; then
                printf "%s" "$release_id"
                return 0
              fi
              echo "Release $RELEASE_TAG is not visible yet; retrying in ${delay}s." >&2
              sleep "$delay"
            done
          }

          release_id="$(find_release_id)"

          if [ -n "$release_id" ]; then
            release_is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)"
            if [ "$release_is_draft" != "true" ]; then
              echo "::error::Published release $RELEASE_TAG already exists."
              exit 1
            fi
            echo "Reusing draft release $RELEASE_TAG ($release_id)."
          else
            args=(
              "$RELEASE_TAG"
              "--repo" "$GITHUB_REPOSITORY"
              "--verify-tag"
              "--title" "Deep Search $RELEASE_TAG"
              "--draft"
            )

            if [ -n "$RELEASE_NOTES" ]; then
              notes_file="$(mktemp)"
              printf "%s" "$RELEASE_NOTES" > "$notes_file"
              args+=("--notes-file" "$notes_file")
            else
              args+=("--generate-notes")
            fi

            gh release create "${args[@]}"
            release_id="$(find_release_id)"
          fi

          if [ -z "$release_id" ]; then
            echo "::error::Could not resolve release ID for $RELEASE_TAG."
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Set release version
        run: npm run release:set-version -- "${{ needs.prepare-release.outputs.tag }}"

      - name: Install dependencies
        run: npm ci

      - name: Configure Windows NSIS bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            fs.writeFileSync('src-tauri/bundle-targets.json', JSON.stringify({
              bundle: { targets: ['nsis', 'app'] },
            }, null, 2));
          "

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          includeUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json ${{ runner.os == 'Windows' && '--config src-tauri/bundle-targets.json' || '' }}

  publish-release:
    name: Publish verified release
    needs:
      - prepare-release
      - publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: Publish installer-only release
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          assets_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")"
          ASSETS_JSON="$assets_json" node <<'NODE'
          const assets = JSON.parse(process.env.ASSETS_JSON);
          const version = process.env.RELEASE_VERSION;
          const expected = [
            `Deep.Search_${version}_aarch64.dmg`,
            `Deep.Search_${version}_x64.dmg`,
            `Deep.Search_${version}_x64-setup.exe`,
          ];
          const actual = assets.map(({ name }) => name).sort();
          const missing = expected.filter((name) => !actual.includes(name));
          const unexpected = actual.filter((name) => !expected.includes(name));

          if (missing.length || unexpected.length || actual.length !== expected.length) {
            throw new Error(
              `Installer-only release mismatch. Missing: ${missing.join(", ") || "none"}; ` +
              `unexpected: ${unexpected.join(", ") || "none"}; ` +
              `actual: ${actual.join(", ")}`,
            );
          }
          NODE

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            --silent
